[package]
name = "threemf2-tests"
version = "0.1.0"
rust-version = "1.89"
edition = "2024"
license = "MIT or Apache-2.0"
publish = false

[dependencies]
threemf2 = { path = "../threemf2", features = [
    "package-write",
    "package-memory-optimized-read",
    "package-lazy-read",
] }

[dev-dependencies]
pretty_assertions = { version = "1.4.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.140" }
instant-xml = { version = "0.7.6" }
